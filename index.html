        '<div class="card soft"><div class="sec-title">Quality so far</div>' +
          '<div class="kv"><span>Spec design ✎</span><b>' + p.specDesign + '</b></div>' +
          '<div class="kv"><span>Team design ✎</span><b style="color:var(--purple)">+' + Math.round(rp.tD) + '</b></div>' +
          '<div class="kv"><span>Spec tech ⚡</span><b>' + p.specTech + '</b></div>' +
          '<div class="kv"><span>Team tech ⚡</span><b style="color:var(--cyan)">+' + Math.round(rp.tT) + '</b></div>' +
          '<div class="kv"><span>Bugs 🐞</span><b style="color:' + (p.bugs > 15 ? 'var(--red)' : 'var(--muted)') + '">' + Math.round(p.bugs) + '</b></div>' +
          '<div class="kv"><span>Score vs market</span><b>' + Math.round(rp.total) + ' / ' + Math.round(rp.exp) + '</b></div>' +
        '</div>' +
        '<div class="card soft"><div class="sec-title">Projection</div>' +
          '<div style="text-align:center;padding:6px 0">' +
            '<div class="mono" style="font-size:38px;font-weight:900;color:var(--amber);line-height:1">' + proj.toFixed(1) + '</div>' +
            '<div style="font-size:11px;color:var(--muted)">projected rating at this pace</div></div>' +
          '<div class="kv"><span>Retail price</span><b>$' + p.price + '</b></div>' +
          '<div class="kv"><span>Unit cost</span><b>$' + p.unit + '</b></div>' +
          '<div class="kv"><span>Sunk cost</span><b>' + money(p.cost) + '</b></div>' +
        '</div>' +
      '</div>' +
      (p.bugs > 15 ? '<div class="card" style="margin-top:14px;border-color:rgba(255,93,108,.45)">' +
        '<b style="color:var(--red)">🐞 The build is buggy.</b><div style="font-size:12px;color:var(--muted);margin-top:4px">' +
        'You are understaffed for a project this size. Hire engineers or expect a rough launch.</div></div>' : ''),
    foot:
      '<button class="btn ghost" data-act="close">Back to office</button>' +
      '<div style="flex:1"></div>' +
      '<button class="btn red" data-act="cancel">🗑️ Cancel project</button>' +
      (pct >= 1 ? '<button class="btn primary" data-act="ship">🚀 Ship it</button>'
                : '<button class="btn cyan" data-act="crunch">☕ Crunch week — ' + money(crunchCost()) + '</button>'),
  });
  root.querySelector('.mfoot').onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'close') { closeModal(); }
    else if (a === 'cancel') {
      confirmModal({
        icon: '🗑️', title: 'Cancel this project?', danger: true,
        body: 'Scrapping <b style="color:var(--txt)">' + esc(p.name) + '</b> writes off the <b style="color:var(--red)">' +
              money(p.cost) + '</b> already spent on it. Nothing comes back.',
        no: 'Keep building', yes: 'Scrap it',
        onYes: () => {
          S.project = null;
          toast('bad', '🗑️ Project cancelled', 'Sunk cost written off.');
          queueSave(); render();
        },
      });
    } else if (a === 'crunch') {
      const cost = crunchCost();
      if (S.cash < cost) return toast('bad', '💸 Cannot fund crunch', 'You need ' + money(cost));
      spend(cost, 'crunch');
      const cr = teamRates();
      p.workDone = Math.min(p.workNeeded, p.workDone + dailyWork() * 7);
      p.teamDesign += cr.d * 3;
      p.teamTech += cr.t * 3;
      S.employees.forEach(x => x.energy = clamp(x.energy - 22, 0, 100));
      toast('info', '☕ Crunch week', 'A week of progress bought with money and morale.');
      sfx('start');
      openProjectStatus(); renderHUD(); queueSave();
    } else if (a === 'ship') {
      openLaunch();
    }
  };
}
function dailyWork() {
  const tb = teamBonus();
  let work = 3.2;
  for (const e of S.employees) work += empOutput(e) * tb * (e.role === 'ops' ? .75 : e.role === 'marketer' ? .35 : 1);
  if (S.officeLevel >= 2) work *= 1.08;
  return work;
}
function crunchCost() { return Math.round(2500 + payroll() * .4); }

function openLaunch() {
  const p = S.project;
  if (!p) return;
  ui.screen = 'launch';
  S.speed = 0;
  const maxSpend = Math.max(0, Math.floor(S.cash));
  const sugg = Math.min(maxSpend, Math.round(p.cost * .45));
  modal({
    icon: '🚀', title: 'Launch "' + p.name + '"', size: 'md',
    sub: 'Choose the marketing push. More money, more first-week noise.',
    body:
      '<div class="card" style="text-align:center;margin-bottom:16px">' +
        '<div style="font-size:42px">' + CATEGORIES[p.cat].icon + '</div>' +
        '<b style="font-size:19px">' + esc(p.name) + '</b>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:3px">' + CATEGORIES[p.cat].name + ' · $' + p.price + ' retail · ' + Math.round(p.workNeeded / 9) + ' days of work</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="sec-title">Launch marketing budget</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">' +
          '<span style="font-size:12px;color:var(--muted)">Spend</span>' +
          '<b class="mono" id="mkVal" style="font-size:22px;color:var(--amber)">' + money(sugg) + '</b></div>' +
        '<input type="range" class="slider" id="mkSlider" min="0" max="' + Math.max(1, maxSpend) + '" value="' + sugg + '">' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px">' +
          '<span>$0 (word of mouth)</span><span>' + money(maxSpend) + ' (all in)</span></div>' +
        '<div id="mkNote" style="margin-top:12px;font-size:12.5px;color:var(--muted)"></div>' +
      '</div>',
    foot: '<button class="btn ghost" data-act="wait">Not yet</button><div style="flex:1"></div>' +
          '<button class="btn primary" data-act="go">🚀 Launch now</button>',
  });
  const slider = $('#mkSlider');
  const note = () => {
    const v = +slider.value;
    $('#mkVal').textContent = money(v);
    const h = clamp(Math.sqrt(v / 9000) * .18, 0, 2.2);
    $('#mkNote').innerHTML = 'Expected hype gain <b style="color:var(--amber)">+' + Math.round(h * 100) + '%</b> → sales multiplier ' +
      '<b style="color:var(--green)">×' + (1 + clamp(S.hype + h, 0, 4) * .7).toFixed(2) + '</b>' +
      '<br>Cash after launch: <b class="mono">' + money(S.cash - v) + '</b>';
  };
  slider.oninput = note; note();
  root.querySelector('.mfoot').onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'wait') { closeModal(); return; }
    const res = launchProject(+slider.value);
    showLaunchResult(res);
  };
}

function showLaunchResult(res) {
  const { prod, rating, fanGain } = res;
  const verdict = rating >= 9 ? ['LEGENDARY', 'var(--amber)', 'The whole industry just stopped to look.']
    : rating >= 7.5 ? ['ACCLAIMED', 'var(--green)', 'Critics love it. Pre-orders are stacking up.']
    : rating >= 6 ? ['SOLID', 'var(--cyan)', 'A good release that will pay the bills.']
    : rating >= 4 ? ['MIXED', 'var(--amber)', 'Some like it. Most shrug.']
    : ['FLOP', 'var(--red)', 'Ouch. Learn from this one.'];
  if (rating >= 7.5) { confetti(140); sfx('done'); } else sfx(rating >= 5 ? 'click' : 'bad');
  ui.screen = 'result';
  modal({
    icon: '🎉', title: prod.name + ' is live!', size: 'sm',
    sub: 'Day one is in the books.',
    body:
      '<div class="launch-hero">' +
        '<div class="launch-score">' + rating.toFixed(1) + '</div>' +
        '<div class="stars" style="font-size:22px;letter-spacing:3px">' + stars(rating) + '</div>' +
        '<div style="margin-top:10px;font-weight:900;letter-spacing:.2em;color:' + verdict[1] + '">' + verdict[0] + '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-top:6px">' + verdict[2] + '</div>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="kv"><span>New fans</span><b style="color:var(--pink)">+' + num(fanGain) + '</b></div>' +
      '<div class="kv"><span>Hype level</span><b style="color:var(--amber)">' + Math.round(S.hype * 100) + '%</b></div>' +
      '<div class="kv"><span>Retail price</span><b>$' + prod.price + '</b></div>' +
      '<div class="kv"><span>Invested</span><b class="mono">' + money(prod.devCost + prod.marketing) + '</b></div>' +
      '<div class="hr"></div>' +
      '<div class="sec-title">First reviews</div>' +
      S.reviews.slice(0, 3).map(r => '<div class="review" style="margin-bottom:8px"><q>“' + esc(r.text) + '”</q>' +
        '<div class="by"><span>' + esc(r.by) + '</span><b class="mono" style="color:var(--amber)">' + r.score.toFixed(1) + '</b></div></div>').join(''),
    foot: '<button class="btn primary wide" data-act="ok">Back to the office</button>',
  });
  root.querySelector('.mfoot').onclick = () => { closeModal(); S.speed = 1; render(); };
}

/* ==========================================================================
   16. SCREEN: OFFICE UPGRADE
   ========================================================================== */
function openOffice() {
  ui.screen = 'office';
  const cur = office();
  const next = OFFICES[S.officeLevel + 1];
  modal({
    icon: '🏢', title: 'Your Office', size: 'md',
    sub: 'Bigger floor, more desks, better perks.',
    body:
      '<div class="card" style="margin-bottom:16px">' +
        '<div style="display:flex;gap:12px;align-items:center">' +
          '<div class="prod-ico" style="font-size:28px">🏢</div>' +
          '<div><b style="font-size:17px">' + cur.name + '</b>' +
            '<div style="font-size:12px;color:var(--muted)">Level ' + (S.officeLevel + 1) + ' of ' + OFFICES.length + ' · ' + cur.w + '×' + cur.h + ' floor</div></div>' +
          '<div style="margin-left:auto;text-align:right">' +
            '<div class="mono" style="font-size:20px;font-weight:800">' + S.employees.length + '/' + cur.desks + '</div>' +
            '<div style="font-size:11px;color:var(--muted)">desks used</div></div>' +
        '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-top:10px">' + esc(cur.perk) + '</div>' +
        '<div class="kv" style="margin-top:8px"><span>Monthly rent</span><b class="mono">' + money(Math.round(2200 * Math.pow(2.35, S.officeLevel))) + '</b></div>' +
      '</div>' +
      (next
        ? '<div class="card" style="border-color:rgba(255,176,32,.4)">' +
            '<div class="sec-title">Next: ' + esc(next.name) + '</div>' +
            '<div class="grid2">' +
              '<div><div class="kv"><span>Desks</span><b style="color:var(--green)">' + cur.desks + ' → ' + next.desks + '</b></div>' +
              '<div class="kv"><span>Floor</span><b>' + next.w + '×' + next.h + '</b></div>' +
              '<div class="kv"><span>New rent</span><b class="mono">' + money(Math.round(2200 * Math.pow(2.35, S.officeLevel + 1))) + '/mo</b></div></div>' +
              '<div style="font-size:12.5px;color:var(--muted);display:flex;align-items:center">✨ ' + esc(next.perk) + '</div>' +
            '</div>' +
            '<button class="btn primary wide" style="margin-top:12px" id="upBtn"' + (S.cash >= next.cost ? '' : ' disabled') + '>' +
              '🏗️ Move in — ' + money(next.cost) + '</button>' +
            (S.cash >= next.cost ? '' : '<div style="text-align:center;font-size:11.5px;color:var(--red);margin-top:7px">You need ' + money(next.cost - S.cash) + ' more</div>') +
          '</div>'
        : '<div class="card" style="text-align:center"><div style="font-size:34px">🏆</div><b>Top of the world.</b>' +
          '<div style="font-size:12.5px;color:var(--muted);margin-top:4px">There is no bigger office to buy.</div></div>') +
      '<div class="hr"></div>' +
      '<div class="sec-title">All locations</div>' +
      '<div style="display:flex;flex-direction:column;gap:7px">' +
        OFFICES.map((o2, i) =>
          '<div class="emp-row" style="opacity:' + (i <= S.officeLevel ? 1 : .55) + '">' +
            '<span style="font-size:20px">' + (i < S.officeLevel ? '✔️' : i === S.officeLevel ? '📍' : '🔒') + '</span>' +
            '<div style="flex:1"><b style="font-size:13px">' + o2.name + '</b>' +
              '<div style="font-size:11px;color:var(--muted)">' + o2.desks + ' desks · ' + esc(o2.perk) + '</div></div>' +
            '<b class="mono" style="font-size:12px;color:var(--amber)">' + (o2.cost ? money(o2.cost) : 'free') + '</b>' +
          '</div>').join('') +
      '</div>',
  });
  const up = $('#upBtn');
  if (up) up.onclick = () => { upgradeOffice(); openOffice(); };
}

/* ==========================================================================
   17. SCREEN: INTRO / GAME OVER / SETTINGS
   ========================================================================== */
function openIntro() {
  ui.screen = 'intro';
  modal({
    icon: '🚀', title: 'Startup Empire Tycoon', size: 'sm',
    sub: 'From a garage desk to a global empire.',
    body:
      '<div style="text-align:center;font-size:54px;line-height:1;margin:4px 0 14px">🏢</div>' +
      '<div style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:16px">' +
        'Name your company, design products component by component, hire the people who make them great, ' +
        'buy hype, read the reviews, and swallow your rivals whole.</div>' +
      '<div class="sec-title">Company name</div>' +
      '<input class="inp" id="coName" maxlength="22" value="' + esc(pick(['Nova Labs', 'Orbit Works', 'Pixel Forge', 'Bitwise Co.', 'Lumen Studio', 'Vertex Labs'])) + '">' +
      '<div class="grid2" style="margin-top:16px">' +
        '<div class="card soft"><div class="sec-title">Starting cash</div><b class="mono" style="font-size:18px;color:var(--green)">$60,000</b></div>' +
        '<div class="card soft"><div class="sec-title">Starting office</div><b style="font-size:15px">🏚️ Garage · 4 desks</b></div>' +
      '</div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.55">' +
        '💡 <b>Tip:</b> hire at least one designer and one engineer before greenlighting anything — solo projects ship badly. ' +
        'Your game saves itself to this browser automatically.</div>',
    foot: '<button class="btn primary wide" data-act="start">Found the company →</button>',
  });
  $('#coName').addEventListener('keydown', e => { if (e.key === 'Enter') root.querySelector('[data-act="start"]').click(); });
  root.querySelector('.mfoot').onclick = () => {
    S.company = ($('#coName').value || 'Nova Labs').trim().slice(0, 22) || 'Nova Labs';
    refreshCandidates(6);
    buildOfficeLayout();
    cam = { x: 0, y: 0, zoom: fitZoom() };
    closeModal();
    S.speed = 1;
    sfx('start');
    toast('good', '🎉 ' + S.company + ' is born', 'Start by hiring someone, then design a product.');
    queueSave();
    render();
  };
}

function gameOverScreen() {
  ui.screen = 'gameover';
  modal({
    icon: '💀', title: 'Bankrupt', size: 'sm',
    sub: 'The bank called. Then the landlord.',
    body:
      '<div style="text-align:center;padding:10px 0">' +
        '<div style="font-size:54px">📉</div>' +
        '<div style="font-size:14px;color:var(--muted);margin-top:8px;line-height:1.6">' +
          esc(S.company) + ' ran out of money on ' + fullDate() + '.</div></div>' +
      '<div class="hr"></div>' +
      '<div class="kv"><span>Products shipped</span><b>' + S.stats.launches + '</b></div>' +
      '<div class="kv"><span>Lifetime revenue</span><b class="mono" style="color:var(--green)">' + money(S.stats.revenue) + '</b></div>' +
      '<div class="kv"><span>Units sold</span><b>' + num(S.stats.units) + '</b></div>' +
      '<div class="kv"><span>Best rating</span><b style="color:var(--amber)">' + (S.stats.best ? S.stats.best.toFixed(1) : '—') + '</b></div>' +
      '<div class="kv"><span>People hired</span><b>' + S.stats.hires + '</b></div>',
    foot: '<button class="btn primary wide" data-act="again">Start over</button>',
  });
  root.querySelector('.mfoot').onclick = () => { hardReset(); };
}
function hardReset() {
  wipeSave();
  S = freshState();
  buildOfficeLayout();
  particles = [];
  closeModal();
  openIntro();
  render();
}
function openSettings() {
  ui.screen = 'settings';
  modal({
    icon: '⚙️', title: 'Settings', size: 'sm', sub: 'Save data lives in this browser only.',
    body:
      '<div class="kv"><span>Company</span><b>' + esc(S.company) + '</b></div>' +
      '<div class="kv"><span>In-game date</span><b>' + fullDate() + '</b></div>' +
      '<div class="kv"><span>Days played</span><b>' + S.day + '</b></div>' +
      '<div class="hr"></div>' +
      '<div style="display:flex;flex-direction:column;gap:9px">' +
        '<button class="btn" data-act="save">💾 Save now</button>' +
        '<button class="btn" data-act="export">📋 Copy save to clipboard</button>' +
        '<button class="btn red" data-act="reset">🗑️ Delete save &amp; restart</button>' +
      '</div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin-top:14px">Shortcuts: <b>Space</b> pause · <b>1/2/3</b> speed · <b>Esc</b> close</div>',
  });
  $('.mbody').onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'save') { save(); toast('good', '💾 Saved', 'Progress stored in this browser.'); }
    else if (b.dataset.act === 'export') {
      try { navigator.clipboard.writeText(JSON.stringify(S)); toast('good', '📋 Copied', 'Save JSON is on your clipboard.'); }
      catch (err) { toast('bad', 'Clipboard blocked', 'Your browser refused the copy.'); }
    } else if (b.dataset.act === 'reset') {
      confirmModal({
        icon: '🗑️', title: 'Delete your save?', danger: true,
        body: '<b style="color:var(--txt)">' + esc(S.company) + '</b> and everything it has shipped will be gone for good, ' +
              'and you will start again from the garage.',
        no: 'Never mind', yes: 'Delete everything',
        onYes: hardReset,
      });
    }
  };
}

/* ==========================================================================
   18. ROUTER + INPUT
   ========================================================================== */
function openScreen(name) {
  const map = {
    build: openBuild, employees: openEmployees, marketing: openMarketing,
    products: openProducts, market: openMarket, office: openOffice,
    project: openProjectStatus, launch: openLaunch, intro: openIntro,
    gameover: gameOverScreen, settings: openSettings,
  };
  (map[name] || openBuild)();
}
function render() { renderHUD(); }

$('#sideMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-screen]');
  if (!b) return;
  sfx('click');
  openScreen(b.dataset.screen);
});
$('#projCard').onclick = () => { sfx('click'); S.project ? openProjectStatus() : openBuild(); };
$('#officeChip').onclick = () => { sfx('click'); openOffice(); };
$('#hypeChip').onclick = () => { sfx('click'); openMarketing(); };
$('#speedCtl').addEventListener('click', e => {
  const b = e.target.closest('[data-speed]');
  if (!b) return;
  S.speed = +b.dataset.speed;
  sfx('click');
  renderHUD();
  queueSave();
});
$('.brand').addEventListener('click', () => { sfx('click'); openSettings(); });
$('.brand').style.cursor = 'pointer';

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { if (root.classList.contains('on')) closeModal(); return; }
  if (e.code === 'Space') { e.preventDefault(); S.speed = S.speed > 0 ? 0 : 1; renderHUD(); return; }
  const speeds = { '1': 1, '2': 2, '3': 4 };
  if (speeds[e.key]) { S.speed = speeds[e.key]; renderHUD(); return; }
  const screens = { 'n': 'build', 'e': 'employees', 'm': 'marketing', 'p': 'products', 'r': 'market', 'o': 'office' };
  if (screens[e.key]) { sfx('click'); openScreen(screens[e.key]); }
});
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* daily sale sparkles in the office */
let lastRevTick = 0;
setInterval(() => {
  if (!S || S.speed === 0) return;
  const recent = S.revenueLog.slice(-3).reduce((a, b) => a + b, 0);
  if (recent > 0 && Date.now() - lastRevTick > 1400) {
    lastRevTick = Date.now();
    spawnParticle('+' + money(recent / 3), '#3ddc90');
  }
}, 900);

/* ==========================================================================
   19. BOOT
   ========================================================================== */
function boot() {
  const loaded = load();
  S = loaded || freshState();
  if (!S.candidates || !S.candidates.length) refreshCandidates(6);
  resizeCanvas();
  buildOfficeLayout();
  cam = { x: 0, y: 0, zoom: fitZoom() };
  render();
  requestAnimationFrame(frame);
  if (!loaded) {
    S.speed = 0;
    openIntro();
  } else {
    toast('info', '💾 Welcome back', esc(S.company) + ' · ' + fullDate());
    S.speed = S.speed || 1;
  }
  window.addEventListener('resize', () => { cam.zoom = clamp(cam.zoom, .45, 2.4); });
}
boot();
</script>
</body>
</html>
