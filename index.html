<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startup Empire Tycoon</title>
<meta name="description" content="Choose your first office, invest in the departments that matter, design products component by component and grow a startup into an empire.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   STARTUP EMPIRE TYCOON — warm studio palette
   ========================================================================== */
:root{
  color-scheme:light;
  --cream:#f4f1ea;
  --cream2:#ebe6db;
  --paper:#eeeae0;
  --paper2:#e2dccf;
  --ink:#38342d;
  --ink2:#6f695e;
  --ink3:#9a9285;
  --line:#d3cabb;
  --line2:#bdb3a2;
  --navy:#3a4560;
  --navy2:#4c5a7c;
  --desk:#5b6784;
  --stamp:#bf3b2e;
  --gold:#bd8a3c;
  --gold2:#a0722c;
  --ok:#4f8a68;
  --warn:#c17f38;
  --bad:#b04a42;
  --panel:rgba(56,52,46,.86);
  --panel2:rgba(70,65,57,.9);
  --onpanel:#f6f2ea;
  --shadow:0 20px 44px -18px rgba(50,42,30,.55);
  --shadow-sm:0 6px 18px -8px rgba(50,42,30,.5);
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:'Barlow',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.cond{font-family:'Barlow Condensed','Barlow',sans-serif}
.up{text-transform:uppercase;letter-spacing:.09em}
.thin-sb::-webkit-scrollbar{width:9px;height:9px}
.thin-sb::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.thin-sb::-webkit-scrollbar-track{background:transparent}

/* ---------------- shell ---------------- */
#app{position:fixed;inset:0;overflow:hidden}
#office{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#office.dragging{cursor:grabbing}

/* ---------------- HUD (corner pills, like the reference) ---------------- */
.hud{position:absolute;z-index:20;display:flex;flex-direction:column;gap:6px}
#hudLeft{left:14px;top:14px;padding-top:env(safe-area-inset-top,0px)}
#hudRight{right:14px;top:14px;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
.pill{
  display:flex;align-items:center;gap:9px;padding:7px 14px 7px 9px;border-radius:999px;
  background:var(--panel);color:var(--onpanel);box-shadow:var(--shadow-sm);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;
}
.pill.r{padding:7px 9px 7px 14px}
.pill .dot{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.14);font-size:12px
}
.pill b{font-size:15px;font-weight:600;letter-spacing:.01em}
.pill.act{cursor:pointer;transition:background .15s}
.pill.act:hover{background:var(--panel2)}

#hudCenter{
  position:absolute;z-index:20;left:50%;transform:translateX(-50%);top:16px;text-align:center;
  padding-top:env(safe-area-inset-top,0px);max-width:36vw;cursor:pointer
}
#projTitle{font-size:17px;font-weight:500;color:var(--ink);line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#projTitle b{font-weight:700}
#projStatus{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-top:1px}
#projTrack{height:4px;border-radius:99px;background:rgba(56,52,46,.16);margin-top:5px;overflow:hidden}
#projTrack>i{display:block;height:100%;border-radius:99px;background:var(--navy);transition:width .4s ease}

/* ---------------- right menu ---------------- */
#menu{
  position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;box-shadow:var(--shadow);border-radius:10px 0 0 10px;overflow:hidden;
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.mrow{
  display:flex;align-items:center;gap:13px;padding:0 26px 0 0;height:54px;width:236px;
  background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.07);
  color:var(--onpanel);text-align:left;transition:background .15s,padding .15s;position:relative
}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:rgba(255,255,255,.09);padding-right:20px}
.mrow .mi{width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:19px;
  background:rgba(0,0,0,.16)}
.mrow .ml{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  font-family:'Barlow Condensed','Barlow',sans-serif;white-space:nowrap}
.mrow .nb{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--stamp);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* ---------------- bottom-left tool buttons ---------------- */
#tools{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;gap:7px;
  padding-bottom:env(safe-area-inset-bottom,0px)}
#tools button{width:38px;height:38px;border-radius:9px;border:0;background:var(--panel);color:var(--onpanel);
  font-size:15px;display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:background .15s}
#tools button:hover{background:var(--panel2)}
#rp{position:absolute;right:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:8px;
  padding-bottom:env(safe-area-inset-bottom,0px);font-size:15px;font-weight:600;color:var(--ink2)}

/* ---------------- toasts ---------------- */
#toasts{position:absolute;left:14px;bottom:64px;z-index:25;display:flex;flex-direction:column-reverse;gap:8px;
  pointer-events:none;max-width:min(360px,58vw)}
.toast{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  animation:tIn .3s cubic-bezier(.2,1.3,.4,1) both}
.toast.out{animation:tOut .28s ease forwards}
.toast b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.toast small{color:var(--ink2);font-size:11.5px}
.toast .ti{font-size:16px;line-height:1.1}
.toast.good{border-left:3px solid var(--ok)}
.toast.bad{border-left:3px solid var(--bad)}
.toast.info{border-left:3px solid var(--navy2)}
.toast.money{border-left:3px solid var(--gold)}
@keyframes tIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateX(-20px)}}
</style>
<style>
/* ==========================================================================
   Overlays
   ========================================================================== */
#modalRoot{position:fixed;inset:0;z-index:60;display:none}
#modalRoot.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(40,35,28,.45);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:22px;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* a plain cream sheet used by most screens */
.sheet{
  width:min(1020px,96vw);max-height:min(90vh,880px);display:flex;flex-direction:column;
  background:var(--cream);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
  animation:pop .26s cubic-bezier(.2,1.2,.35,1) both
}
.sheet.sm{width:min(540px,96vw)} .sheet.md{width:min(760px,96vw)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);
  background:var(--cream2)}
.sheet-head .hi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;
  background:var(--paper2)}
.sheet-head h2{margin:0;font-size:19px;font-weight:700;font-family:'Barlow Condensed','Barlow',sans-serif;
  letter-spacing:.05em;text-transform:uppercase}
.sheet-head p{margin:1px 0 0;font-size:12.5px;color:var(--ink2)}
.sheet-body{padding:18px 20px;overflow:auto;flex:1}
.sheet-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;
  flex-wrap:wrap;background:var(--cream2)}
.xbtn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--cream);font-size:14px;display:grid;place-items:center;transition:.15s;flex:none}
.xbtn:hover{background:var(--bad);border-color:var(--bad);color:#fff}

/* full-bleed screens (employees, builder) */
.full{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .2s ease both}
.full-top{display:flex;align-items:center;gap:12px;padding:18px 22px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));flex:none;z-index:3}
.full-top h2{margin:0;font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  font-family:'Barlow Condensed','Barlow',sans-serif}
.full-mid{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 8px}
.nav-arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;
  border:0;background:transparent;font-size:30px;line-height:1;display:grid;place-items:center;
  transition:transform .15s,opacity .15s;opacity:.85;z-index:4
}
.nav-arrow:hover{transform:translateY(-50%) scale(1.16);opacity:1}
.nav-arrow:disabled{opacity:.22;cursor:not-allowed}
.nav-arrow.l{left:10px} .nav-arrow.r{right:10px}

/* ==========================================================================
   Employees — paper CV on a desk
   ========================================================================== */
#empScreen{background:var(--desk);color:#fff}
#empScreen::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 45%,rgba(255,255,255,.10),transparent 70%)}
#empScreen .xbtn{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
#empScreen .xbtn:hover{background:var(--stamp);border-color:var(--stamp)}
#empScreen .nav-arrow{color:#fff}
.chev{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);
  background:transparent;color:#fff;display:grid;place-items:center;font-size:12px;flex:none;transition:.15s}
.chev:hover{background:rgba(255,255,255,.16)}
.cv{
  width:min(420px,92vw);background:var(--paper);color:var(--ink);border-radius:3px;padding:26px 26px 30px;
  box-shadow:0 26px 54px -16px rgba(0,0,0,.55);position:relative;
  animation:cvIn .28s cubic-bezier(.2,1.2,.35,1) both
}
@keyframes cvIn{from{opacity:0;transform:translateY(16px) rotate(-1deg)}to{opacity:1;transform:none}}
.cv-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.cv-photo{width:120px;height:132px;flex:none;border-radius:2px;overflow:hidden;background:#8a9b86}
.cv-photo svg{display:block;width:100%;height:100%}
.cv-sum{flex:1;background:var(--navy);color:#fff;border-radius:2px;height:58px;display:grid;place-items:center;
  font-family:'Barlow Condensed','Barlow',sans-serif;font-size:21px;font-weight:700;letter-spacing:.14em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px 16px}
.field.wide{grid-column:1/-1}
.field .lab{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);
  font-family:'Barlow Condensed','Barlow',sans-serif;margin-bottom:5px}
.field .val{background:var(--paper2);border-radius:3px;padding:7px 11px;font-size:14px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .val.strong{color:var(--ink);font-weight:600}
.stamp{
  position:absolute;right:20px;bottom:16px;padding:5px 14px;border:3px solid var(--stamp);color:var(--stamp);
  font-family:'Barlow Condensed','Barlow',sans-serif;font-size:27px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;border-radius:5px;transform:rotate(-13deg) scale(2.4);opacity:0;pointer-events:none;
  mix-blend-mode:multiply
}
.stamp.hit{animation:stampIn .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stampIn{
  0%{opacity:0;transform:rotate(-26deg) scale(2.6)}
  55%{opacity:.92;transform:rotate(-11deg) scale(.94)}
  72%{transform:rotate(-13deg) scale(1.05)}
  100%{opacity:.92;transform:rotate(-13deg) scale(1)}
}
.pagenum{text-align:center;font-size:14px;margin-top:16px;color:rgba(255,255,255,.75)}
.pagenum b{color:#fff;font-weight:600}
.cv-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.desk-props{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.desk-props i{position:absolute;display:block;border-radius:2px;opacity:.85}
.pencil{width:9px;height:128px;border-radius:3px;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.paperstack{width:122px;height:96px;background:var(--paper2);border-radius:2px;
  box-shadow:0 8px 18px -8px rgba(0,0,0,.5);opacity:.7}

/* ==========================================================================
   Product builder — paged component pages
   ========================================================================== */
#buildScreen{color:#fff;background:
  radial-gradient(120% 80% at 18% 8%, #f3d9b8 0%, rgba(243,217,184,0) 55%),
  radial-gradient(100% 70% at 88% 18%, #cfd9e2 0%, rgba(207,217,226,0) 60%),
  linear-gradient(165deg,#b9a894 0%,#8f8a92 52%,#5f6270 100%)}
#buildScreen::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 55% at 50% 42%,rgba(255,255,255,.34),transparent 70%)}
#buildScreen .xbtn{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
#buildScreen .xbtn:hover{background:var(--stamp);border-color:var(--stamp)}
#buildScreen .nav-arrow{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.bld-cost{font-size:16px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.bld-cost span{opacity:.72;font-weight:400}
.bld-name{position:absolute;left:50%;transform:translateX(-50%);text-align:center;
  font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.4);white-space:nowrap}
.bld-name b{font-weight:700}
.bld-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start;
  width:100%;max-width:1180px;padding:0 54px}
.bld-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.bld-col h3{margin:0 0 2px;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  text-align:center;font-family:'Barlow Condensed','Barlow',sans-serif;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{
  position:relative;padding:11px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.22);
  background:rgba(60,52,48,.42);color:#fff;text-align:left;transition:.14s;overflow:hidden;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)
}
.opt:hover{background:rgba(90,78,70,.55);border-color:rgba(255,255,255,.4)}
.opt.on{background:rgba(232,214,184,.9);border-color:#fff;color:var(--ink);
  box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.opt.lock{opacity:.4;cursor:not-allowed}
.opt.lock:hover{background:rgba(60,52,48,.42);border-color:rgba(255,255,255,.22)}
.opt .on-name{font-size:14.5px;font-weight:600;display:block}
.opt .on-meta{font-size:11px;opacity:.82;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.opt.on .on-meta{opacity:.75}
.bld-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 13px;border-radius:7px;background:rgba(60,52,48,.42);border:1px solid rgba(255,255,255,.2);
  font-size:14px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.rnd{width:27px;height:27px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:transparent;
  color:#fff;display:grid;place-items:center;font-size:12px;transition:.14s;flex:none}
.rnd:hover{background:rgba(255,255,255,.22)}
.sw{width:44px;height:24px;border-radius:99px;background:rgba(0,0,0,.35);position:relative;
  border:1px solid rgba(255,255,255,.25);transition:.16s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:.16s}
.sw.on{background:var(--ok)} .sw.on::after{left:22px}
.pv-stage{display:flex;flex-direction:column;align-items:center;gap:12px;flex:none}
#previewCanvas{width:236px;height:400px;filter:drop-shadow(0 26px 30px rgba(35,28,20,.55))}
.pv-meta{display:flex;gap:16px;font-size:12.5px;text-shadow:0 1px 5px rgba(0,0,0,.4)}
.pv-meta b{font-weight:700}
.bld-foot{flex:none;display:flex;align-items:center;gap:12px;padding:14px 54px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.dots{display:flex;gap:6px;justify-content:center;margin:0 auto}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:.15s}
.dots i.on{background:#fff;transform:scale(1.35)}
</style>
<style>
/* ==========================================================================
   Buttons, cards, shared bits
   ========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:9px;
  border:1px solid var(--line2);background:var(--cream);color:var(--ink);font-weight:600;font-size:14px;
  transition:.14s;font-family:'Barlow',sans-serif
}
.btn:hover{background:var(--paper2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold2);color:#fff}
.btn.gold:hover{background:var(--gold2)}
.btn.green{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.green:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.btn.light{background:rgba(255,255,255,.9);border-color:transparent;color:var(--ink)}
.btn.light:hover{background:#fff}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}

.card{background:var(--cream2);border:1px solid var(--line);border-radius:12px;padding:15px}
.card.plain{background:rgba(255,255,255,.55)}
.sect{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);
  margin:0 0 10px;font-family:'Barlow Condensed','Barlow',sans-serif}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0}
.kv span{color:var(--ink2)} .kv b{font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--cream2);
  font-size:13.5px;font-weight:600;transition:.14s}
.tab:hover{background:var(--paper2)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.inp{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line2);background:#fff;
  color:var(--ink);font-size:15px;font-weight:500;font-family:inherit}
.inp:focus{outline:2px solid var(--navy);outline-offset:1px}
.bar{height:7px;border-radius:99px;background:var(--paper2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--navy);transition:width .4s}
.bar.gold>i{background:var(--gold)} .bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)}
.hr{height:1px;background:var(--line);border:0;margin:16px 0}
.empty{text-align:center;padding:44px 18px;color:var(--ink2);font-size:14px}
.empty .big{font-size:42px;display:block;margin-bottom:10px;opacity:.55}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;
  border-radius:99px;background:var(--paper2);color:var(--ink2);
  font-family:'Barlow Condensed','Barlow',sans-serif}
.tag.ok{background:rgba(79,138,104,.16);color:var(--ok)}
.tag.gold{background:rgba(189,138,60,.18);color:var(--gold2)}
.tag.navy{background:rgba(58,69,96,.14);color:var(--navy)}
.tag.bad{background:rgba(176,74,66,.15);color:var(--bad)}

/* ---------------- department / investment cards ---------------- */
.dept{
  display:flex;gap:13px;align-items:flex-start;padding:14px;border-radius:12px;
  background:var(--cream2);border:1px solid var(--line);transition:.15s
}
.dept.maxed{background:rgba(79,138,104,.09);border-color:rgba(79,138,104,.35)}
.dept .di{width:46px;height:46px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:22px;
  background:var(--paper2)}
.dept h4{margin:0;font-size:15px;font-weight:700}
.dept .eff{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.pips{display:flex;gap:4px;margin-top:8px}
.pips i{width:100%;height:6px;border-radius:2px;background:var(--paper2)}
.pips i.fill{background:var(--gold)}
.dept-buy{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* ---------------- office picker ---------------- */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.pick{
  text-align:left;padding:0;border-radius:14px;border:2px solid var(--line);background:var(--cream2);
  overflow:hidden;transition:.16s;display:flex;flex-direction:column
}
.pick:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.pick.on{border-color:var(--navy);background:#fff;box-shadow:var(--shadow-sm)}
.pick-art{height:96px;display:grid;place-items:center;font-size:42px;background:var(--paper2);flex:none}
.pick-b{padding:14px}
.pick h4{margin:0 0 3px;font-size:16px;font-weight:700}
.pick .sub{font-size:12px;color:var(--ink2);margin-bottom:10px}
.perk{display:flex;gap:7px;font-size:12.5px;line-height:1.45;margin-top:5px}
.perk .s{flex:none;width:14px;font-weight:700}
.perk.up .s{color:var(--ok)} .perk.dn .s{color:var(--bad)}

/* ---------------- roster ---------------- */
.emp{display:flex;align-items:center;gap:12px;padding:11px;border-radius:11px;background:var(--cream2);
  border:1px solid var(--line)}
.emp-av{width:46px;height:46px;border-radius:9px;overflow:hidden;flex:none;background:#8a9b86}
.emp-av svg{width:100%;height:100%;display:block}
.ebar{height:6px;border-radius:99px;background:var(--paper2);overflow:hidden;flex:1;min-width:64px}
.ebar>i{display:block;height:100%;background:var(--ok)}
.ebar.low>i{background:var(--bad)}

/* ---------------- products / market ---------------- */
.prod{border-radius:12px;border:1px solid var(--line);background:var(--cream2);overflow:hidden}
.prod-top{display:flex;gap:13px;padding:14px;align-items:flex-start}
.prod-ico{width:50px;height:50px;border-radius:11px;display:grid;place-items:center;font-size:24px;flex:none;
  background:var(--paper2)}
.stars{color:var(--gold);font-size:14px;letter-spacing:1px}
.spark{display:block;width:100%;height:40px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0}
.sbar{flex:1;height:13px;border-radius:99px;background:var(--paper2);overflow:hidden}
.sbar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
.review{padding:12px 14px;border-radius:11px;background:var(--cream2);border:1px solid var(--line);
  border-left:3px solid var(--gold)}
.review q{font-style:italic;font-size:13.5px;line-height:1.5;display:block}
.review .by{font-size:12px;color:var(--ink2);margin-top:7px;display:flex;justify-content:space-between;gap:8px}

/* ---------------- launch result ---------------- */
.score{font-size:72px;font-weight:700;line-height:1;color:var(--navy);
  font-family:'Barlow Condensed','Barlow',sans-serif;
  animation:sPop .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sPop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;
  background:var(--paper2);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--navy);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:grab}
.slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--navy);
  border:3px solid #fff;cursor:grab}

/* ---------------- story events ---------------- */
.ev-tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;background:var(--navy);color:#fff;
  font-family:'Barlow Condensed','Barlow',sans-serif}
.ev-body{font-size:15px;line-height:1.65;color:var(--ink);
  padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.ev-body b{font-weight:700}
.ev-choices{display:flex;flex-direction:column;gap:9px}
.ev-choice{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;
  border-radius:11px;border:1px solid var(--line2);background:var(--cream2);transition:.14s
}
.ev-choice:hover:not(:disabled){background:#fff;border-color:var(--navy);transform:translateX(3px)}
.ev-choice:disabled{opacity:.45;cursor:not-allowed}
.ev-ch-main{flex:1;min-width:0}
.ev-ch-main b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.ev-hint{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.ev-cost{font-size:15px;font-weight:700;color:var(--gold2);white-space:nowrap;flex:none}
.ev-cost.no{color:var(--bad)}
.hold{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:11px;
  background:var(--cream2);border:1px solid var(--line)}
.hold .hi2{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:21px;background:var(--paper2)}
.story-row{display:flex;gap:12px;padding:11px 13px;border-radius:10px;background:var(--cream2);
  border:1px solid var(--line);border-left:3px solid var(--navy)}
.story-row .sd{font-size:12px;color:var(--ink2);white-space:nowrap;flex:none;min-width:84px}

/* ---------------- responsive ---------------- */
@media (max-width:1100px){
  .bld-grid{grid-template-columns:1fr;gap:14px;padding:0 44px;max-width:620px}
  .pv-stage{order:-1}
  #previewCanvas{width:168px;height:286px}
  .bld-col h3{text-align:left}
}
@media (max-width:860px){

  .mrow{width:auto;flex:1;height:auto;flex-direction:column;gap:3px;padding:9px 4px;

  .mrow:hover{padding:9px 4px}
  .mrow .mi{width:26px;height:26px;background:transparent;font-size:17px}
  .mrow .ml{font-size:10px;letter-spacing:.05em}
  .mrow .nb{position:absolute;top:4px;right:10px;margin:0}
  #tools{bottom:82px} #rp{bottom:86px}
  #toasts{bottom:128px;max-width:72vw}
  #hudCenter{max-width:46vw;top:auto;bottom:88px}
  .scrim{padding:0}
  .sheet{width:100vw!important;height:100%;max-height:100%;border-radius:0}
  .g2,.g3{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr 1fr}
  .bld-grid{padding:0 42px}
  .nav-arrow{width:42px;height:42px;font-size:24px}
  .nav-arrow.l{left:2px} .nav-arrow.r{right:2px}
  .cv{padding:20px 18px 24px}
  .cv-photo{width:92px;height:104px}
  .stamp{font-size:22px;right:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

function mods() {
  const m = { candidate: 0, output: 0, hype: 0, salary: 0, sales: 0, design: 0, tech: 0 };

  for (const k in hm) m[k] = (m[k] || 0) + hm[k];
  if (S.contractDeal) m.sales += .05;
  if (S.charter) m.sales += .03;
  if (S.unionised) m.output += .06;
  return m;

function makeCandidate(bias = 0) {
  const role = pick(Object.keys(ROLES));
  const country = pick(COUNTRIES);
  const exp = irnd(0, 18);
  const m = S && S.startId ? mods() : { candidate: 0, salary: 0 };
  const skill = Math.round(clamp(rnd(1.6, 9.4) * (1 + m.candidate) + bias * .5 + exp * .12, 1, 10) * 10) / 10;
  const traits = [];
  const tc = Math.random() < .55 ? 1 : (Math.random() < .35 ? 2 : 0);
  const pool = TRAITS.slice();
  for (let i = 0; i < tc; i++) traits.push(pool.splice(irnd(0, pool.length - 1), 1)[0].n);
  let salary = (420 + Math.pow(skill, 2.35) * 47 + exp * 130) * country.m;
  if (traits.includes('Expensive')) salary *= 1.25;
  salary = Math.max(400, Math.round(salary * (1 + m.salary) / 50) * 50);
  return {
    id: uid(), name: pick(FIRST) + ' ' + pick(LAST), role, country: country.n, flag: country.f,
    age: clamp(20 + exp + irnd(0, 9), 20, 62), exp, skill, salary, traits,
    energy: 100, desk: -1, xp: 0,
  };
}
function refreshCandidates(n = 8) {
  S.candidates = [];
  for (let i = 0; i < n; i++) S.candidates.push(makeCandidate(S.officeLevel));
  ui.candIndex = 0;
}
function traitObj(n) { return TRAITS.find(t => t.n === n) || { n, good: true, fx: '', v: 0, d: '' }; }
function traitMult(e, fx) { let m = 1; for (const t of e.traits) { const T = traitObj(t); if (T.fx === fx) m += T.v; } return m; }
function empOutput(e) { return e.skill * clamp(.45 + e.energy / 145, .45, 1.08) * traitMult(e, 'work'); }
function teamBonus() { let b = 1; for (const e of S.employees) b += (traitMult(e, 'team') - 1); return clamp(b, .7, 1.6); }
function payroll() { return S.employees.reduce((a, e) => a + e.salary, 0); }
function monthlyBurn() {
  const hb = holdingBooks();
  return payroll() + rentCost() + (S.loan ? S.loan.monthly : 0) + hb.up - hb.inc;
}
function runwayMonths() {
  const income = S.revenueLog.slice(-30).reduce((a, b) => a + b, 0);
  const net = monthlyBurn() - income;
  return net <= 0 ? Infinity : S.cash / net;
}
function hireCandidate(c) {
  if (S.employees.length >= deskCapacity()) { toast('bad', 'No free desks', 'Move to a bigger office to seat more people.'); return false; }
  if (S.cash < c.salary) { toast('bad', 'Not enough cash', 'You cannot cover the first month of salary.'); return false; }
  c.desk = S.employees.length;
  S.employees.push(c);
  S.candidates = S.candidates.filter(x => x.id !== c.id);
  S.stats.hires++;
  spend(c.salary);
  toast('good', c.name + ' joined', ROLES[c.role].label + ' · ' + moneyFull(c.salary) + '/month');
  sfx('hire'); queueSave();

}
function fireEmployee(id) {
  const i = S.employees.findIndex(e => e.id === id);
  if (i < 0) return;
  const e = S.employees[i];

}

function earn(n) { S.cash += n; S.stats.revenue += n; }
function spend(n) { S.cash -= n; S.stats.spend += n; }

function specTotals(catId, specs) {
  const cat = CATEGORIES[catId];
  const m = mods();
  let cost = cat.baseCost, days = cat.baseDays, design = 0, tech = 0, unit = 0;
  for (const part of cat.parts) {
    const opt = part.opts[specs[part.key] ?? 0];
    if (!opt) continue;
    cost += opt.c; days += opt.d; design += opt.dz; tech += opt.tz; unit += opt.u;
  }
  design = Math.round(design * (1 + m.design));
  tech = Math.round(tech * (1 + m.tech));
  const crew = S.employees.length;
  const speedF = clamp(1.25 - crew * .045, .55, 1.25) / (1 + m.output);
  return {
    cost: Math.round(cost), days: Math.max(5, Math.round(days * speedF)),
    design, tech, unit: Math.round(unit),
    points: Math.round(design * cat.wD + tech * cat.wT),
  };
}
function expectedPoints() {
  const yrs = gameDate().getFullYear() - 2002;
  return Math.min(132, 44 * Math.pow(1.38, yrs));
}
const TEAM_K = 8;
function teamRates() {
  const tb = teamBonus(), m = mods();
  let d = 0, t = 0;
  for (const e of S.employees) {
    const out = empOutput(e) * tb;
    if (e.role === 'design') d += out * .19 * traitMult(e, 'design');
    if (e.role === 'engineer') t += out * .19 * traitMult(e, 'tech');
    if (e.role === 'ops') { d += out * .04; t += out * .04; }
  }
  return { d: d * (1 + m.design), t: t * (1 + m.tech) };
}
function teamPoints(rd, rt) {
  let tD = rd * TEAM_K, tT = rt * TEAM_K;
  const cap = expectedPoints() * .75, tot = tD + tT;
  if (tot > cap && tot > 0) { const f = cap / tot; tD *= f; tT *= f; }
  return { tD, tT };
}
function dailyWork() {
  const tb = teamBonus(), m = mods();
  let w = 3.2;
  for (const e of S.employees) w += empOutput(e) * tb * (e.role === 'ops' ? .75 : e.role === 'marketer' ? .35 : 1);
  return w * (1 + m.output);
}
function suggestedPrice(catId, specs) {
  const t = specTotals(catId, specs), cat = CATEGORIES[catId];
  return Math.max(1, Math.round(cat.priceHint > 1.5 ? t.unit * 2.2 + t.points * 1.6 : 4 + t.points * 1.35));
}
function priceRange(catId, specs) {
  const s = suggestedPrice(catId, specs);
  return { min: Math.max(1, Math.round(s * .45)), max: Math.round(s * 2.1), sug: s };
}
function startProject(catId, name, specs, price) {
  const t = specTotals(catId, specs);
  if (S.cash < t.cost) { toast('bad', 'Cannot fund it', 'Development needs ' + money(t.cost)); return false; }
  spend(t.cost);
  S.project = {
    id: uid(), cat: catId, name, specs: { ...specs }, price,
    cost: t.cost, unit: t.unit, totalDays: t.days, daysDone: 0,
    specDesign: t.design, specTech: t.tech, teamDesign: 0, teamTech: 0, bugs: 0,
    workDone: 0, workNeeded: t.days * dailyWork() * (S.rushNext ? .8 : 1),
    idealCrew: Math.max(1, (t.design + t.tech) / 26), startDay: S.day,
  };
  if (S.rushNext) { S.rushNext = false; toast('info', 'Head start', 'The team had already sketched this one.'); }
  toast('money', '"' + name + '" in development', money(t.cost) + ' invested · about ' + t.days + ' days');
  sfx('start'); queueSave();
  return true;
}
const PHASES = [[0,'Preparing'],[.18,'Design'],[.42,'Engineering'],[.68,'QA & polish'],[.88,'Pre-launch'],[1,'Ready to ship']];
function projectPct(p) { return clamp(p.workDone / p.workNeeded, 0, 1); }
function projectPhase(p) { const r = projectPct(p); let l = PHASES[0][1]; for (const [t, n] of PHASES) if (r >= t) l = n; return l; }

function advanceProject() {
  const p = S.project;
  const rates = teamRates();
  p.workDone += dailyWork();
  p.teamDesign += rates.d;
  p.teamTech += rates.t;
  p.daysDone++;
  for (const e of S.employees) {
    e.energy = clamp(e.energy - rnd(.35, 1.15) * traitMult(e, 'stam'), 0, 100);
    e.xp += .6 * traitMult(e, 'grow');
    if (e.xp > 100) { e.xp = 0; e.skill = Math.round(Math.min(10, e.skill + .1) * 10) / 10; }
  }
  const ideal = p.idealCrew || 1;
  if (S.employees.length < ideal) p.bugs += (ideal - S.employees.length) * .2;
  if (p.workDone >= p.workNeeded) { p.workDone = p.workNeeded; S.speed = 0; openScreen('launch'); sfx('done'); }
}
function ratingParts(p) {
  const cat = CATEGORIES[p.cat];
  const dd = Math.max(1, p.daysDone);
  const { tD, tT } = teamPoints(p.teamDesign / dd, p.teamTech / dd);
  const exp = expectedPoints();
  return { tD, tT, exp, total: (p.specDesign + tD) * cat.wD + (p.specTech + tT) * cat.wT };
}
function computeRating(p, noJitter) {
  const { total, exp } = ratingParts(p);
  let ratio = total / exp;
  ratio *= clamp(1 - p.bugs * .006, .5, 1);
  if (S.officeLevel >= 2) ratio *= 1.06;
  let r = 1 + 9 * (ratio - .38) / (1.42 - .38);
  if (!noJitter) r += rnd(-.4, .4);
  return clamp(Math.round(r * 10) / 10, .4, 10);
}
function launchProject(marketingSpend) {
  const p = S.project;
  if (!p) return null;
  const m = mods();
  if (marketingSpend > 0) spend(marketingSpend);
  const cat = CATEGORIES[p.cat];
  const rating = computeRating(p);
  const hypeAdd = clamp(Math.sqrt(marketingSpend / 9000) * .18, 0, 2.2) * (1 + m.hype);
  S.hype = clamp(S.hype + hypeAdd, 0, 4);
  const prod = {
    id: uid(), name: p.name, cat: p.cat, rating, price: p.price, unit: p.unit,
    launchDay: S.day, devCost: p.cost, marketing: marketingSpend,
    units: 0, revenue: 0, profit: -p.cost - marketingSpend, active: true,
    history: [], specs: p.specs,
  };
  S.products.unshift(prod);
  S.stats.launches++;
  S.stats.best = Math.max(S.stats.best, rating);
  S.rp += Math.round(rating * 20);
  S.project = null;
  const band = rating >= 8.5 ? 'great' : rating >= 6.8 ? 'good' : rating >= 4.5 ? 'mid' : 'bad';
  for (let i = 0; i < 3; i++) {
    S.reviews.unshift({
      id: uid(), by: pick(REVIEWERS), product: prod.name,
      score: clamp(Math.round((rating + rnd(-.9, .9)) * 10) / 10, .5, 10),
      text: pick(REVIEW_LINES[band]).replace('{cat}', cat.name.toLowerCase()), day: S.day,
    });
  }
  S.reviews = S.reviews.slice(0, 24);
  const fanGain = Math.round(rating * rating * 24 * (1 + S.hype));
  S.fans += fanGain;
  queueSave();
  return { prod, rating, fanGain };
}
function dailySales() {
  const m = mods();
  let dayRevenue = 0;
  for (const prod of S.products) {
    if (!prod.active) continue;
    const age = S.day - prod.launchDay;
    const cat = CATEGORIES[prod.cat];
    if (age > 720) { prod.active = false; continue; }
    const appeal = .06 + .94 * Math.pow(clamp(prod.rating / 10, .04, 1), 1.7);
    const value = prod.unit * 1.6 + prod.rating * (cat.priceHint > 1.5 ? 42 : 9) + 6;
    const priceF = clamp(1.65 - prod.price / (value * 1.05), .03, 1.7);
    const reach = 1 + Math.sqrt(Math.max(0, S.fans)) / 200 + S.share / 120;
    const hypeF = 1 + S.hype * .7;
    const market = 420 * cat.market * reach;
    const ramp = age < 10 ? .45 + age * .055 : 1;
    const decay = Math.exp(-age / (58 + prod.rating * 11));
    let units = market * appeal * priceF * hypeF * ramp * decay * rnd(.85, 1.15);
    if (!isFinite(units) || units < 0) units = 0;
    const rev = units * (prod.price - prod.unit) * (1 + m.sales) * (1 - (S.investorCut || 0));
    prod.units += units;
    prod.revenue += Math.max(0, units * prod.price);
    prod.profit += rev;
    prod.history.push(Math.round(rev));
    if (prod.history.length > 160) prod.history.shift();
    dayRevenue += rev;
    S.stats.units += units;
    S.fans += units * (prod.rating / 10) * .012;
    if (units < 3 && age > 40) prod.active = false;
  }
  if (dayRevenue !== 0) earn(dayRevenue);
  S.revenueLog.push(Math.round(dayRevenue));
  if (S.revenueLog.length > 400) S.revenueLog.shift();
}
function monthlyBooks() {
  const pay = payroll(), rent = rentCost();
  if (pay > 0) spend(pay);
  if (rent > 0) spend(rent);
  let sub = 0;
  for (const r of S.rivals) if (r.owned) sub += Math.round(r.value * .022);
  if (sub) earn(sub);
  const hb = holdingBooks();
  if (hb.up) spend(hb.up);
  if (hb.inc) earn(hb.inc);
  if (S.loan) {
    const due = Math.min(S.loan.monthly, S.loan.remaining);
    spend(due);
    S.loan.remaining -= due;
    if (S.loan.remaining <= 0) { S.loan = null; toast('good', 'Loan repaid', 'The bank is off your back.'); }
  }
  toast('info', dateLabel() + ' books',
    'Payroll ' + money(pay) + ' · rent ' + money(rent) + (sub ? ' · subsidiaries +' + money(sub) : '') +
    (hb.up ? ' · holdings ' + money(hb.up - hb.inc) : '') +
    (S.loan ? ' · loan ' + money(S.loan.monthly) : ''));
  if (S.cash < 0) {
    toast('bad', 'You are in the red', 'Cut costs or ship something fast.');
    if (S.cash < -250000) { S.speed = 0; openScreen('gameover'); return; }
  }
  const days = Math.min(180, S.revenueLog.length) || 1;
  const mineYr = S.revenueLog.slice(-180).reduce((a, b) => a + b, 0) * (365 / days);
  let rivalRev = 0, subsRev = 0;
  for (const r of S.rivals) {
    if (r.owned) { subsRev += r.value * .22; continue; }
    r.value = Math.round(r.value * rnd(1.001, 1.007));
    r.strength = clamp(r.strength + rnd(-.08, .14), 3, 9.9);
    rivalRev += r.value * .22;
  }
  const ours = Math.max(0, mineYr) + subsRev;
  S.share = clamp(lerp(S.share, ours / Math.max(1, ours + rivalRev) * 100, .3), .3, 97);
  for (const r of S.rivals) r.share = r.owned ? 0 : (1 - S.share / 100) * (r.value * .22) / Math.max(1, rivalRev) * 100;
  refreshCandidates(8);
  $('#empBadge').hidden = false;
  queueSave();
}
/* Financing — without it, overspending before your first product is a dead end */
function loanCap() { return Math.max(40000, Math.round(netWorth() * .4)); }
function loanOffers() {
  const cap = loanCap();
  return [.35, .7, 1].map(f => {
    const amount = Math.round(cap * f / 1000) * 1000;
    const total = Math.round(amount * 1.35);
    return { amount, total, monthly: Math.round(total / 24) };
  }).filter(o => o.amount >= 10000);
}
function takeLoan(amount) {
  if (S.loan) { toast('bad', 'You already owe the bank', 'Clear the current loan first.'); return; }
  const total = Math.round(amount * 1.35);
  S.loan = { borrowed: amount, total, remaining: total, monthly: Math.round(total / 24) };
  S.cash += amount;
  toast('money', 'Loan approved', moneyFull(amount) + ' now · ' + moneyFull(S.loan.monthly) + '/mo for 24 months');
  sfx('cash'); queueSave();
}
function investDept(id) {
  const d = DEPTS.find(x => x.id === id);
  const lvl = dlv(id);
  if (lvl >= DEPT_MAX) return;
  const cost = deptCost(d, lvl);
  if (S.cash < cost) { toast('bad', 'Not enough cash', d.name + ' level ' + (lvl + 1) + ' costs ' + money(cost)); return; }
  spend(cost);
  S.depts[id] = lvl + 1;
  S.stats.invested += cost;
  buildOfficeLayout();
  toast('good', d.name + ' → level ' + (lvl + 1), d.eff(lvl + 1));
  sfx('cash'); confetti(26); queueSave();
}
function acquire(id) {
  const r = S.rivals.find(x => x.id === id);
  if (!r || r.owned) return;
  const price = Math.round(r.value * 1.35);
  if (S.cash < price) { toast('bad', 'Not enough cash', 'You need ' + money(price)); return; }
  spend(price);
  r.owned = true;
  S.stats.acquisitions++;
  S.share = clamp(S.share + r.share, 0, 97);
  r.share = 0;
  S.fans += Math.round(r.value / 900);
  toast('good', 'Acquired ' + r.name, 'For ' + money(price) + ' · +' + money(Math.round(r.value * .022)) + '/month');
  sfx('cash'); confetti(60); queueSave();
}
function upgradeOffice() {
  const ladder = officeLadder();
  const next = ladder[S.officeLevel + 1];
  if (!next) { toast('info', 'Top floor reached', 'There is nothing bigger to buy.'); return; }
  if (S.cash < next.cost) { toast('bad', 'Cannot afford it', next.name + ' costs ' + money(next.cost)); return; }
  spend(next.cost);
  S.officeLevel++;
  buildOfficeLayout();
  cam = { x: 0, y: 0, zoom: fitZoom() };
  toast('good', 'Moved into ' + next.name, next.perk);
  sfx('cash'); confetti(44); queueSave();
}

/* ==========================================================================
   8. MAIN LOOP
   ========================================================================== */
let acc = 0, lastT = 0;
function tickDay() {
  S.day++;
  if (S.project) advanceProject();
  dailySales();
  const m = mods();
  let mk = 0;
  for (const e of S.employees) if (e.role === 'marketer') mk += empOutput(e) * traitMult(e, 'hype');
  S.hype = clamp(S.hype * (S.officeLevel >= 3 ? .987 : .978) + mk * .0016 * (1 + m.hype), 0, 4);
  S.rp += dlv('rnd');
  for (const e of S.employees) {
    e.energy = clamp(e.energy + (S.project ? .55 : rnd(1.6, 3.2)), 0, 100);
    if (e.energy < 12 && Math.random() < .004) {
      toast('bad', e.name + ' is burnt out', 'Output is way down — give the team a break.');
      e.energy = 26;
    }
  }
  S.campaigns = S.campaigns.filter(c => S.day - c.start < c.days);
  /* one nudge toward financing before a broke player stalls out entirely */
  if (!S.nudgedLoan && !S.loan && !S.project && S.cash < 15000 &&
      !S.products.some(pr => pr.active)) {
    S.nudgedLoan = true;
    toast('info', 'Running low on cash', 'Departments → Financing can lend you enough to ship the next product.');
  }
  if (gameDate().getDate() === 1 && S.day > 0) monthlyBooks();
  maybeEvent();
  if (S.day % 7 === 0) queueSave();
}
function modalOpen() { return $('#modalRoot').classList.contains('on'); }
function frame(t) {
  if (!lastT) lastT = t;
  const dt = Math.min(250, t - lastT);
  lastT = t;
  if (S && S.startId && S.speed > 0 && !modalOpen()) {
    acc += dt * S.speed;
    let guard = 0;
    while (acc >= MS_PER_DAY && guard++ < 20) { acc -= MS_PER_DAY; tickDay(); }
    renderHUD();
  }
  drawOffice(t);
  requestAnimationFrame(frame);
}

/* ==========================================================================
   9. ISOMETRIC OFFICE — light studio style
   ========================================================================== */
const cv = $('#office');
const ctx = cv.getContext('2d');
const TW = 64, TH = 32;
let cam = { x: 0, y: 0, zoom: 1 };
let LAYOUT = null;
let particles = [];
let P = { ox: 0, oy: 0, z: 1 };

function resizeCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv._w = r.width; cv._h = r.height;
}
window.addEventListener('resize', resizeCanvas);

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  const b = clamp(Math.round((n & 255) * f), 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function iso(x, y, zh = 0) {
  return [P.ox + (x - y) * (TW / 2) * P.z, P.oy + (x + y) * (TH / 2) * P.z - zh * P.z];
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = (lw || 1) * P.z; ctx.stroke(); }
}
function box(x, y, z, sx, sy, hz, color, opt = {}) {
  const z1 = z + hz;
  poly([iso(x, y + sy, z), iso(x + sx, y + sy, z), iso(x + sx, y + sy, z1), iso(x, y + sy, z1)], opt.left || shade(color, .9));
  poly([iso(x + sx, y, z), iso(x + sx, y + sy, z), iso(x + sx, y + sy, z1), iso(x + sx, y, z1)], opt.right || shade(color, .8));
  poly([iso(x, y, z1), iso(x + sx, y, z1), iso(x + sx, y + sy, z1), iso(x, y + sy, z1)], opt.top || color);
}
/* soft contact shadow, offset toward the light */
function shadow(x, y, sx, sy, a = .1) {
  ctx.save();
  ctx.globalAlpha = a;
  poly([iso(x + .1, y + .1, 0), iso(x + sx + .3, y + .1, 0), iso(x + sx + .3, y + sy + .3, 0), iso(x + .1, y + sy + .3, 0)], '#6b6154');
  ctx.restore();
}

/* ---------------- layout ---------------- */
function buildOfficeLayout() {
  if (!S || !S.startId) return;
  const of = office();
  const desks = [];
  const cols = Math.max(2, Math.floor((of.w - 1) / 2));
  let i = 0;
  outer:
  for (let row = 1; row < of.h - 1.4; row += 2) {
    for (let c = 0; c < cols; c++) {
      const x = 1 + c * 2;
      if (x >= of.w - 1.2) continue;
      desks.push({ x: x + .08, y: row + .1 });
      if (++i >= of.desks) break outer;
    }
  }
  const props = [];
  const rx = of.w - 1.25, by = of.h - 1.3;
  props.push({ t: 'plant', x: .22, y: .22 });
  props.push({ t: 'clock', x: 2.4, y: .06 });
  props.push({ t: 'frame', x: 4.1, y: .06 });
  /* HR buys the comfortable things */
  const hr = dlv('hr');
  if (hr >= 1) props.push({ t: 'coffee', x: .28, y: by - .9 });
  if (hr >= 2) props.push({ t: 'sofa', x: rx - 1.5, y: by - .1 });
  if (hr >= 3) props.push({ t: 'table', x: rx - 2.9, y: by - .2 });
  if (hr >= 4) { props.push({ t: 'plant', x: rx, y: .3 }); props.push({ t: 'plant', x: .26, y: by }); }
  if (hr >= 5) props.push({ t: 'cabinet', x: 6.2, y: .05 });
  /* network buys racks */
  for (let k = 0; k < dlv('network'); k++) props.push({ t: 'rack', x: rx, y: 1.3 + k * 1.05 });
  /* marketing buys boards and posters */
  if (dlv('mkt') >= 1) props.push({ t: 'board', x: .05, y: 1.5 });
  if (dlv('mkt') >= 3) props.push({ t: 'poster', x: .05, y: 3.2 });
  if (dlv('mkt') >= 5) props.push({ t: 'poster', x: .05, y: 4.4 });
  /* sales buys a floor board */
  if (dlv('sales') >= 1) props.push({ t: 'salesboard', x: Math.min(7.6, of.w - 1.6), y: .06 });
  if (dlv('sales') >= 3) props.push({ t: 'phonedesk', x: rx, y: by - 2.3 });
  /* R&D buys a lab bench */
  if (dlv('rnd') >= 1) props.push({ t: 'lab', x: 1.2, y: by });
  if (dlv('rnd') >= 4) props.push({ t: 'lab', x: 3.1, y: by });
  /* trophies for acquisitions */
  for (let k = 0; k < Math.min(3, S.stats.acquisitions); k++) props.push({ t: 'trophy', x: 5.2 + k * .5, y: .06 });
  /* a small office must not have furniture standing outside its own walls */
  for (const pr of props) {
    pr.x = clamp(pr.x, .04, Math.max(.04, of.w - .7));
    pr.y = clamp(pr.y, .04, Math.max(.04, of.h - .8));
  }
  LAYOUT = { w: of.w, h: of.h, desks, props };
}
function projBase() {
  const z = cam.zoom, w = LAYOUT.w, h = LAYOUT.h;
  return {
    ox: cv._w / 2 - ((w / 2 - h / 2) * TW / 2) * z + cam.x,
    oy: cv._h / 2 - ((w / 2 + h / 2) * TH / 2) * z + cam.y + 30 * z,
    z,
  };
}
function fitZoom() {
  if (!LAYOUT || !cv._w) return 1;
  const needW = (LAYOUT.w + LAYOUT.h) * TW / 2;
  const needH = (LAYOUT.w + LAYOUT.h) * TH / 2 + 150;
  return clamp(Math.min((cv._w - 300) / needW, (cv._h - 90) / needH), .4, 1.9);
}

/* ---------------- room shell ---------------- */
function drawRoom() {
  const w = LAYOUT.w, h = LAYOUT.h, WH = 104;
  /* floor */
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      poly([iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)],
        (x + y) % 2 === 0 ? '#e8e3d8' : '#e3ddd1');
    }
  }
  /* soft gradient wash over the floor */
  ctx.save();
  ctx.globalAlpha = .1;
  poly([iso(0, 0), iso(w, 0), iso(w, h), iso(0, h)], '#b9ae9a');
  ctx.restore();
  /* walls */
  poly([iso(0, 0, 0), iso(w, 0, 0), iso(w, 0, WH), iso(0, 0, WH)], '#e4dfd4');
  poly([iso(0, 0, 0), iso(0, h, 0), iso(0, h, WH), iso(0, 0, WH)], '#d6d0c4');
  /* skirting */
  poly([iso(0, 0, 0), iso(w, 0, 0), iso(w, 0, 6), iso(0, 0, 6)], '#cfc8ba');
  poly([iso(0, 0, 0), iso(0, h, 0), iso(0, h, 6), iso(0, 0, 6)], '#c3bcae');
  /* tall windows on the long wall */
  for (let y = 1.3; y < h - 1.2; y += 2.9) window3d(y, Math.min(y + 1.9, h - 1.1), WH);
}
function window3d(a, b, WH) {
  const z0 = 26, z1 = WH - 12;
  const frame = [iso(0, a - .09, z0 - 3), iso(0, b + .09, z0 - 3), iso(0, b + .09, z1 + 3), iso(0, a - .09, z1 + 3)];
  poly(frame, '#f6f4ee');
  const g = [iso(0, a, z0), iso(0, b, z0), iso(0, b, z1), iso(0, a, z1)];
  const grad = ctx.createLinearGradient(g[0][0], g[2][1], g[0][0], g[0][1]);
  grad.addColorStop(0, '#cfe4ee'); grad.addColorStop(.65, '#dfecf2'); grad.addColorStop(1, '#eee6d8');
  poly(g, grad);
  /* distant buildings */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(g[0][0], g[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(g[i][0], g[i][1]);
  ctx.closePath(); ctx.clip();
  ctx.globalAlpha = .3;
  const rng = seeded('sky' + a + S.officeLevel);
  for (let i = 0; i < 6; i++) {
    const t0 = a + (b - a) * (i / 6), t1 = t0 + (b - a) / 7;
    const top = z0 + (z1 - z0) * (.18 + rng() * .45);
    poly([iso(0, t0, z0), iso(0, t1, z0), iso(0, t1, top), iso(0, t0, top)], '#8ea6b4');
  }
  ctx.restore();
  /* mullions */
  const mid = (a + b) / 2;
  poly([iso(0, mid - .035, z0), iso(0, mid + .035, z0), iso(0, mid + .035, z1), iso(0, mid - .035, z1)], '#f6f4ee');
  const mz = (z0 + z1) / 2;
  poly([iso(0, a, mz - 1.6), iso(0, b, mz - 1.6), iso(0, b, mz + 1.6), iso(0, a, mz + 1.6)], '#f6f4ee');
}

/* ---------------- desks & staff ---------------- */
const SKINS = ['#f0c8a4', '#e0a87c', '#c4835a', '#96603f', '#6f4632', '#f7dcc2'];
const HAIRS = ['#33261c', '#6b4226', '#c08a3c', '#cfc7bd', '#20202a', '#8a3b2e', '#4a4270'];
const SHIRTS = { design: '#8c7ab8', engineer: '#4d7f97', marketer: '#b86f86', ops: '#5f8f6d' };

function drawDesk(d, emp, t) {

  shadow(x, y, .95, .68);
  box(x + .05, y + .06, 0, .08, .08, 26, '#c8a87c');
  box(x + .82, y + .54, 0, .08, .08, 26, '#c8a87c');
  box(x, y, 26, .95, .68, 5, '#f2eee4');

    box(cx + .03, cy + .04, 13 + bob, .26, .26, 18, tired ? shade(shirt, .78) : shirt);
    box(cx + .085, cy + .095, 31 + bob, .17, .17, 14, skin);
    box(cx + .075, cy + .085, 45 + bob, .19, .19, 4, hair);
    if (S.project && Math.sin(t / 900 + emp.desk * 2.3) > .85) {

function bubble(x, y, z, emoji) {
  const [sx, sy] = iso(x, y, z);

/* ---------------- props ---------------- */
function drawProp(p, t) {
  const x = p.x, y = p.y;
  switch (p.t) {
    case 'plant':
      shadow(x, y, .46, .46);
      box(x + .08, y + .08, 0, .3, .3, 15, '#f0ece2');
      for (let i = 0; i < 4; i++) {
        const a = i * 1.57 + Math.sin(t / 1600 + x) * .1;
        box(x + .2 + Math.cos(a) * .09, y + .2 + Math.sin(a) * .09, 15, .11, .11, 20 + i * 5, i % 2 ? '#6f9463' : '#7fa46f');
      }
      break;
    case 'coffee':
      shadow(x, y, .58, .48);
      box(x, y, 0, .55, .45, 32, '#e6e1d6');
      box(x + .07, y + .06, 32, .4, .33, 18, '#4a463f');
      box(x + .14, y + .12, 50, .26, .2, 4, '#c9704f');
      break;
    case 'sofa':
      shadow(x, y, 1.45, .78);
      box(x, y, 0, 1.4, .7, 15, '#cfc6b6');
      box(x, y, 15, 1.4, .18, 20, '#d8d0c1');
      box(x, y + .2, 15, .26, .5, 8, '#d8d0c1');
      box(x + 1.1, y + .2, 15, .26, .5, 8, '#d8d0c1');
      break;
    case 'table':
      shadow(x, y, .9, .62);
      box(x + .38, y + .24, 0, .14, .14, 16, '#c8a87c');
      box(x, y, 16, .9, .6, 5, '#d9bb92');
      box(x + .3, y + .2, 21, .26, .2, 2, '#f2eee4');
      break;
    case 'cabinet':
      shadow(x, y, .5, 1.3);
      box(x, y, 0, .45, 1.25, 62, '#d3b389');
      for (let i = 0; i < 4; i++) box(x + .46, y + .15 + i * .26, 30 + (i % 2) * 14, .02, .2, 13, '#b9714f');
      break;
    case 'rack':
      shadow(x, y, .45, .7);
      box(x, y, 0, .42, .68, 62, '#474d57');
      for (let i = 0; i < 6; i++) {
        poly([iso(x + .43, y + .1, 9 + i * 9), iso(x + .43, y + .2, 9 + i * 9),
              iso(x + .43, y + .2, 12.5 + i * 9), iso(x + .43, y + .1, 12.5 + i * 9)],
          Math.sin(t / 200 + i * 2.1) > .1 ? '#7fd6a4' : '#3f7a5c');
      }
      break;
    case 'board':
      box(x, y, 34, .05, 1.5, 48, '#f8f6f1');
      ctx.save(); ctx.globalAlpha = .55;
      for (let i = 0; i < 3; i++) {
        const z = 72 - i * 11;
        poly([iso(x - .01, y + .18 + i * .1, z), iso(x - .01, y + .92 - i * .14, z),
              iso(x - .01, y + .92 - i * .14, z + 3), iso(x - .01, y + .18 + i * .1, z + 3)],
          i === 1 ? '#c9704f' : '#4d7f97');
      }
      ctx.restore();
      break;
    case 'poster':
      box(x, y, 46, .04, .82, 34, '#ead9c0');
      poly([iso(x - .01, y + .1, 54), iso(x - .01, y + .72, 54), iso(x - .01, y + .72, 74), iso(x - .01, y + .1, 74)], '#b86f86');
      break;
    case 'salesboard':
      box(x, y + .04, 36, .05, 1.35, 44, '#f8f6f1');
      for (let i = 0; i < 5; i++) {
        const hgt = 6 + i * 6;
        poly([iso(x - .01, y + .2 + i * .2, 44), iso(x - .01, y + .34 + i * .2, 44),
              iso(x - .01, y + .34 + i * .2, 44 + hgt), iso(x - .01, y + .2 + i * .2, 44 + hgt)], '#5f8f6d');
      }
      break;
    case 'phonedesk':
      shadow(x, y, .55, .8);
      box(x, y, 0, .5, .75, 26, '#f2eee4');
      box(x + .1, y + .12, 26, .3, .24, 7, '#4a463f');
      box(x + .16, y + .44, 26, .18, .18, 10, '#c9704f');
      break;
    case 'lab':
      shadow(x, y, 1.05, .6);
      box(x, y, 0, 1, .55, 28, '#eceae3');
      box(x + .12, y + .14, 28, .16, .16, 14, '#9fd0c8');
      box(x + .42, y + .16, 28, .13, .13, 19, '#c9a7d8');
      box(x + .7, y + .12, 28, .15, .15, 11, '#e0cf8a');
      break;
    case 'clock': {
      const [cxp, cyp] = iso(x, .02, 74);
      ctx.save();
      ctx.beginPath(); ctx.arc(cxp, cyp, 9 * P.z, 0, 7);
      ctx.fillStyle = '#f8f6f1'; ctx.fill();
      ctx.strokeStyle = '#b6ae9e'; ctx.lineWidth = 1.4 * P.z; ctx.stroke();
      const mins = (S.day * 37) % 60, hrs = (S.day * 5) % 12;
      ctx.strokeStyle = '#4a463f'; ctx.lineWidth = 1.6 * P.z;
      ctx.beginPath(); ctx.moveTo(cxp, cyp);
      ctx.lineTo(cxp + Math.cos(hrs / 12 * 6.28 - 1.57) * 4 * P.z, cyp + Math.sin(hrs / 12 * 6.28 - 1.57) * 4 * P.z);
      ctx.moveTo(cxp, cyp);
      ctx.lineTo(cxp + Math.cos(mins / 60 * 6.28 - 1.57) * 6.5 * P.z, cyp + Math.sin(mins / 60 * 6.28 - 1.57) * 6.5 * P.z);
      ctx.stroke();
      ctx.restore();
      break;
    }
    case 'frame':
      box(x, y + .1, 54, .04, .66, 40, '#c8a87c');
      poly([iso(x - .01, y + .17, 60), iso(x - .01, y + .69, 60), iso(x - .01, y + .69, 88), iso(x - .01, y + .17, 88)], '#9fb8c4');
      break;
    case 'trophy':
      box(x, y + .42, 36, .08, .24, 5, '#c8a87c');
      box(x + .02, y + .48, 41, .05, .12, 12, '#d9b24a');
      break;
  }
}

function drawOffice(t) {
  if (!S || !S.startId || !LAYOUT) return;
  if (!cv._w) resizeCanvas();
  P = projBase();
  const W = cv._w, H = cv._h;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f7f4ed'); g.addColorStop(1, '#e9e3d6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  drawRoom();
  const ents = [];
  LAYOUT.desks.forEach((d, i) => ents.push({ d: d.x + d.y, f: () => drawDesk(d, S.employees[i], t) }));
  LAYOUT.props.forEach(p => {
    const flat = p.t === 'board' || p.t === 'poster' || p.t === 'clock' || p.t === 'frame' ||
                 p.t === 'trophy' || p.t === 'salesboard';
    ents.push({ d: p.x + p.y + (flat ? -4 : 0), f: () => drawProp(p, t) });
  });
  ents.sort((a, b) => a.d - b.d);
  for (const e of ents) e.f();
  drawParticles();
}
function spawnParticle(text, color) {
  if (!LAYOUT || !LAYOUT.desks.length) return;
  const d = pick(LAYOUT.desks);
  particles.push({ x: d.x, y: d.y, z: 82, text, color, life: 1 });
}
function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.z += .55; p.life -= .009;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    const [sx, sy] = iso(p.x, p.y, p.z);
    ctx.save();
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.font = '700 ' + (14 * P.z) + "px Barlow, sans-serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText(p.text, sx + 1, sy + 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, sx, sy);
    ctx.restore();
  }
}

let AC = null, muted = false;
function sfx(kind) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const notes = {
      click: [[600, .05, 'square', .035]],
      hire: [[523, .09, 'triangle', .06], [659, .09, 'triangle', .06], [784, .16, 'triangle', .06]],
      cash: [[880, .07, 'square', .045], [1174, .12, 'square', .04]],
      start: [[392, .08, 'sawtooth', .04], [523, .14, 'sawtooth', .04]],
      done: [[659, .1, 'triangle', .06], [880, .18, 'triangle', .05]],
      bad: [[220, .18, 'sawtooth', .05]],
    }[kind] || [];
    let t0 = AC.currentTime;
    for (const [f, d, type, vol] of notes) {
      const osc = AC.createOscillator(), gain = AC.createGain();
      osc.type = type; osc.frequency.value = f;
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      osc.connect(gain).connect(AC.destination);
      osc.start(t0); osc.stop(t0 + d + .02);
      t0 += d * .8;
    }
  } catch (e) {}
}
const confCv = $('#confetti'), confCtx = confCv.getContext('2d');
let confParts = [], confRAF = 0;
function confetti(n = 70) {
  confCv.hidden = false;
  confCv.width = window.innerWidth; confCv.height = window.innerHeight;
  const cols = ['#bd8a3c', '#4d7f97', '#5f8f6d', '#b86f86', '#8c7ab8', '#3a4560'];
  for (let i = 0; i < n; i++) confParts.push({
    x: window.innerWidth / 2 + rnd(-140, 140), y: window.innerHeight * .42,
    vx: rnd(-7, 7), vy: rnd(-14, -4), w: rnd(5, 11), h: rnd(6, 14),
    rot: rnd(0, 6.28), vr: rnd(-.25, .25), c: pick(cols), life: rnd(70, 140),
  });
  if (!confRAF) confRAF = requestAnimationFrame(confTick);
}
function confTick() {
  confCtx.clearRect(0, 0, confCv.width, confCv.height);
  for (let i = confParts.length - 1; i >= 0; i--) {
    const p = confParts[i];
    p.vy += .42; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if (p.life <= 0 || p.y > confCv.height + 40) { confParts.splice(i, 1); continue; }
    confCtx.save();
    confCtx.translate(p.x, p.y); confCtx.rotate(p.rot);
    confCtx.fillStyle = p.c; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    confCtx.restore();
  }
  if (confParts.length) confRAF = requestAnimationFrame(confTick);
  else { confRAF = 0; confCv.hidden = true; }
}

/* ---------------- device preview ---------------- */
function drawPreview(canvas, cat, specs) {
  if (!canvas) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = canvas.clientWidth || 236, H = canvas.clientHeight || 400;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const idx = k => specs[k] ?? 0;
  const rr = (x, y, w, h, rad) => {
    c.beginPath(); c.moveTo(x + rad, y);
    c.arcTo(x + w, y, x + w, y + h, rad); c.arcTo(x + w, y + h, x, y + h, rad);
    c.arcTo(x, y + h, x, y, rad); c.arcTo(x, y, x + w, y, rad); c.closePath();
  };

  if (cat === 'phone') {
    const cols = ['#8d8a83', '#d6d3cc', '#3f3d39', '#e7dcc2'];
    const pw = W * .62, ph = H * .84, px = (W - pw) / 2, py = (H - ph) / 2;
    rr(px, py, pw, ph, 22); c.fillStyle = '#ffffff'; c.fill();
    rr(px + 3, py + 3, pw - 6, ph - 6, 19); c.fillStyle = cols[idx('body')]; c.fill();
    const s = idx('screen'), bez = [13, 10, 7, 5][s];
    rr(px + bez, py + bez + 10, pw - bez * 2, ph - bez * 2 - 20, 12);
    const g = c.createLinearGradient(px, py, px + pw, py + ph);
    const wall = [['#6e8fa8', '#d9c3a8'], ['#4f7fa6', '#e8c49a'], ['#3f6b96', '#e9b184'], ['#33517f', '#d98f7a']][s];
    g.addColorStop(0, wall[0]); g.addColorStop(1, wall[1]);
    c.fillStyle = g; c.fill();
    /* a horizon line, so the screen reads as a photo rather than a swatch */
    c.save();
    rr(px + bez, py + bez + 10, pw - bez * 2, ph - bez * 2 - 20, 12); c.clip();
    c.fillStyle = 'rgba(30,26,22,.22)';
    c.fillRect(px, py + ph * .62, pw, ph);
    c.beginPath(); c.arc(px + pw * .68, py + ph * .58, 13, 0, 7);
    c.fillStyle = 'rgba(255,244,222,.75)'; c.fill();
    c.restore();
    /* speaker + front camera, sized by the frontal camera tier */
    c.fillStyle = '#4a4740';
    rr(px + pw / 2 - 22, py + 6, 30, 4, 2); c.fill();
    const fr = [2, 2.8, 3.6, 4.6][idx('front')];
    c.beginPath(); c.arc(px + pw / 2 + 18, py + 8, fr, 0, 7); c.fill();
    /* UI rows */
    c.save(); c.globalAlpha = .85;
    for (let i = 0; i < 4; i++) {
      rr(px + bez + 10, py + ph * .34 + i * 17, (pw - bez * 2 - 20) * (i === 0 ? 1 : .5 + i * .14), 8, 4);
      c.fillStyle = ['#bd8a3c', '#4d7f97', '#5f8f6d', '#8c7ab8'][i]; c.fill();
    }
    c.restore();
    /* rear cameras */
    const cams = [1, 2, 3, 4][idx('camera')];
    const bx = px + 11, by = py + 13, bs = cams > 2 ? 34 : 25;
    rr(bx, by, bs, bs, 9); c.fillStyle = 'rgba(0,0,0,.14)'; c.fill();
    for (let i = 0; i < cams; i++) {
      const ox = bx + 9 + (i % 2) * 14, oy = by + 9 + Math.floor(i / 2) * 14;
      c.beginPath(); c.arc(ox, oy, 5, 0, 7); c.fillStyle = '#35332e'; c.fill();
      c.beginPath(); c.arc(ox - 1.4, oy - 1.4, 1.7, 0, 7); c.fillStyle = 'rgba(190,225,245,.9)'; c.fill();
    }
    c.font = '600 12px Barlow, sans-serif'; c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.92)';
    c.fillText(['3000','4200','5000','6000'][idx('battery')] + ' mAh · ' +
      ['A1','B4','X9','Neural'][idx('chip')], W / 2, py + ph + 18);
  }

  else if (cat === 'app' || cat === 'game') {
    const ww = W * .92, wh = H * .56, wx = (W - ww) / 2, wy = H * .2;
    rr(wx, wy, ww, wh, 10); c.fillStyle = '#ffffff'; c.fill();
    rr(wx, wy, ww, 20, 10); c.fillStyle = '#e6e1d6'; c.fill();
    c.fillRect(wx, wy + 13, ww, 7);
    ['#c9704f', '#d9b24a', '#5f8f6d'].forEach((cc, i) => {
      c.beginPath(); c.arc(wx + 12 + i * 12, wy + 10, 3.6, 0, 7); c.fillStyle = cc; c.fill();
    });
    if (cat === 'app') {
      const uxi = idx('ux');
      const accent = ['#9a9488', '#4d7f97', '#8c7ab8', '#bd8a3c'][uxi];
      c.fillStyle = '#f2efe7'; c.fillRect(wx, wy + 20, ww * .26, wh - 20);
      for (let i = 0; i < 4; i++) {
        rr(wx + 8, wy + 30 + i * 14, ww * .26 - 16, 7, 3.5);
        c.fillStyle = i === 0 ? accent : '#ddd8cc'; c.fill();
      }
      const cols2 = [1, 2, 2, 3][uxi];
      const bw = (ww * .74 - 10 * (cols2 + 1)) / cols2;
      for (let i = 0; i < cols2 * 2; i++) {
        const bx2 = wx + ww * .26 + 10 + (i % cols2) * (bw + 10);
        const by2 = wy + 30 + Math.floor(i / cols2) * (wh * .3);
        rr(bx2, by2, bw, wh * .24, 6); c.fillStyle = '#f2efe7'; c.fill();
        rr(bx2 + 6, by2 + 7, bw * .55, 5, 2.5); c.fillStyle = accent; c.fill();
        rr(bx2 + 6, by2 + 17, bw * .8, 4, 2); c.fillStyle = '#ddd8cc'; c.fill();
      }
      if (idx('feature') >= 2) { c.font = '15px serif'; c.fillText('✨', wx + ww - 24, wy + wh - 10); }
    } else {
      const art = idx('art');
      const sky = c.createLinearGradient(0, wy + 20, 0, wy + wh);
      const sk = [['#b9a6c4', '#e0cdd2'], ['#a8c4dc', '#dfe9ee'], ['#8fb0c4', '#cddde2'], ['#7d8e9c', '#c2cdd2']][art];
      sky.addColorStop(0, sk[0]); sky.addColorStop(1, sk[1]);
      c.fillStyle = sky; c.fillRect(wx, wy + 20, ww, wh - 20);
      c.fillStyle = ['#7fa46f', '#6f9463', '#83926b', '#6d7a63'][art];
      c.fillRect(wx, wy + wh - 26, ww, 26);
      const hx = wx + ww * .3, hy = wy + wh - 26;
      if (art === 0) { c.fillStyle = '#e0cf8a'; c.fillRect(hx, hy - 16, 6, 6); c.fillStyle = '#c9704f'; c.fillRect(hx - 2, hy - 10, 10, 10); }
      else { c.beginPath(); c.arc(hx + 4, hy - 18, 6, 0, 7); c.fillStyle = '#e0cf8a'; c.fill();
             rr(hx - 2, hy - 12, 12, 12, 3); c.fillStyle = '#c9704f'; c.fill(); }
      for (let i = 0; i < 3 + art; i++) {
        const px2 = wx + 14 + i * (ww - 28) / (3 + art);
        c.fillStyle = 'rgba(70,60,50,.22)';
        c.fillRect(px2, wy + wh - 26 - (8 + i * 4), 10, 8 + i * 4);
      }
      rr(wx + 8, wy + 26, 40, 6, 3); c.fillStyle = '#c9704f'; c.fill();
    }
    c.font = '600 12px Barlow, sans-serif'; c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.9)';
    c.fillText(cat === 'app' ? 'v1.0 build' : 'alpha build', W / 2, wy + wh + 20);
  }

  else {
    const band = ['#5d6470', '#8b8f97', '#c6c9cf', '#e7e2d6'][idx('band')];
    const cw = W * .52, ch = cw * 1.14, cx0 = (W - cw) / 2, cy0 = H * .3;
    c.fillStyle = band;
    rr(cx0 + cw * .22, cy0 - H * .19, cw * .56, H * .26, 8); c.fill();
    rr(cx0 + cw * .22, cy0 + ch - 8, cw * .56, H * .26, 8); c.fill();
    rr(cx0, cy0, cw, ch, 18); c.fillStyle = ['#6a6f78', '#9a9ea6', '#d3d6db', '#efe9db'][idx('band')]; c.fill();
    const d = idx('disp');
    rr(cx0 + 6, cy0 + 6, cw - 12, ch - 12, 13);
    c.fillStyle = ['#4a4740', '#3d4653', '#333d4d', '#2c3544'][d]; c.fill();
    const fx = cx0 + cw / 2, fy = cy0 + ch / 2;
    c.strokeStyle = ['#9a9488', '#7fb2cc', '#86c2a4', '#e0cf8a'][d]; c.lineWidth = 3;
    c.beginPath(); c.arc(fx, fy, cw * .28, -1.5, 1.2); c.stroke();
    c.strokeStyle = '#d99ab0';
    c.beginPath(); c.arc(fx, fy, cw * .2, -1.5, .4 + idx('sensor') * .5); c.stroke();
    c.font = '700 14px Barlow, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#f6f2ea';
    c.fillText(['8 204', '12 480', '16 902', '21 337'][idx('sensor')], fx, fy + 5);
    c.font = '600 9px Barlow, sans-serif'; c.fillStyle = 'rgba(246,242,234,.65)';
    c.fillText('STEPS', fx, fy + 16);
  }
}

function sparkline(data, color) {
  if (!data || data.length < 2) return '<svg class="spark"></svg>';
  const w = 240, h = 40, max = Math.max(...data, 1), min = Math.min(...data, 0);
  const pts = data.map((v, i) => [i / (data.length - 1) * w, h - 2 - (v - min) / (max - min || 1) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<path d="' + d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z" fill="' + color + '" opacity=".16"/>' +
    '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round"/></svg>';
}

    when: () => netWorth() > 25000000 && S.products.length >= 4,
    title: 'Somebody wants to buy you',
    body: () => { const r = S.rivals.filter(x => !x.owned).sort((a, b) => b.value - a.value)[0];
      return '<b>' + esc(r ? r.name : 'A larger company') + '</b> has made an offer for the whole company. ' +
        'It is a great deal of money, and the end of doing it your way.'; },
    choices: [
      { label: 'Sell a minority stake', hint: 'Cash now, a cut of everything later',
        run() { const amount = Math.round(netWorth() * .3);
          S.cash += amount; S.investorCut = (S.investorCut || 0) + .08;
          return 'You sell 30% for ' + moneyFull(amount) + '. They get a board seat and 8% of revenue.'; } },
      { label: 'Refuse, publicly', hint: '+hype, +fans, and a target on your back',
        run() { S.hype = clamp(S.hype + .4, 0, 4); S.fans += 50000;
          S.rivals.forEach(r => { if (!r.owned) r.strength = clamp(r.strength + .4, 3, 9.9); });
          return 'Your refusal letter gets published. It is widely admired, and they are now competing with you properly.'; } },
      { label: 'Use the offer to raise your own valuation', hint: 'Quietly effective',
        run() { S.share = clamp(S.share + 2, 0, 97); S.rp += 500;
          return 'You shop the offer around and never sign it. Your valuation goes up regardless.'; } },
    ],
  },
  {
    id: 'bailout', icon: '🆘', once: true, tag: 'Empire',
    when: () => S.cash > 8000000 && S.rivals.some(r => !r.owned && r.value < S.cash * .8),
    title: 'A rival is in trouble',
    body: () => { const r = S.rivals.filter(x => !x.owned).sort((a, b) => a.value - b.value)[0];
      return '<b>' + esc(r ? r.name : 'A competitor') + '</b> cannot make payroll this month. ' +
        'Their board is asking whether you would be interested in a very quick conversation.'; },
    choices: [
      { label: 'Buy them at a discount', hint: 'Half the usual acquisition price',
        cost: () => { const r = S.rivals.filter(x => !x.owned).sort((a, b) => a.value - b.value)[0];
          return r ? Math.round(r.value * .65) : 0; },
        run() { const r = S.rivals.filter(x => !x.owned).sort((a, b) => a.value - b.value)[0];
          if (!r) return 'Somebody else got there first.';
          r.owned = true; S.stats.acquisitions++;
          S.share = clamp(S.share + r.share, 0, 97); r.share = 0;
          return 'You buy ' + esc(r.name) + ' for well under what it is worth. Their staff arrive on Monday.'; } },
      { label: 'Lend them the money', hint: 'They owe you, and they survive',
        cost: () => 2000000,
        run() { S.hype = clamp(S.hype + .18, 0, 4);
          return 'You keep a competitor alive. The industry notices, and it is not the worst reputation to have.'; } },
      { label: 'Let them fail', hint: 'Their share goes to whoever is left',
        run() { const r = S.rivals.filter(x => !x.owned).sort((a, b) => a.value - b.value)[0];
          if (r) { r.owned = true; r.share = 0; r.value = Math.round(r.value * .2); S.share = clamp(S.share + 1.5, 0, 97); }
          return 'They wind down over six weeks. You pick up some of their customers and none of their debt.'; } },
    ],
  },
  {
    id: 'stadium', icon: '🏟️', once: true, tag: 'Empire',
    when: () => S.cash > 30000000 && S.fans > 200000,
    title: 'Naming rights are available',
    body: 'A 60 000-seat stadium needs a name for the next ten years. Yours would fit on the facade nicely.',
    choices: [
      { label: 'Put your name on it', hint: 'Big, permanent hype', cost: () => 22000000,
        run() { S.hype = clamp(S.hype + .55, 0, 4); S.fans += 180000; S.stadium = true;
          return 'Every match report for the next decade contains your company name. Your marketing lead cries slightly.'; } },
      { label: 'Sponsor the youth academy instead', hint: 'Cheaper, warmer, slower', cost: () => 3000000,
        run() { S.hype = clamp(S.hype + .2, 0, 4); S.fans += 40000; addHolding('lab');
          return 'Less glamorous, and much better liked. Some of those kids will work for you one day.'; } },
      { label: 'Spend it on the product', hint: 'Research points instead',
        run() { S.rp += 900;
          return 'No stadium. The R&D budget has never looked healthier.'; } },
    ],
  },
];

/* ---------------- triggering ---------------- */
function eligible(e) {
  if (e.followup) return false;
  if (e.once && S.seen.includes(e.id)) return false;
  /* a repeatable situation should not come round again within a couple of years */
  const last = (S.lastFired || {})[e.id];
  if (last != null && S.day - last < 620) return false;
  try { return !!e.when(); } catch (err) { return false; }
}
function maybeEvent() {
  if (!S.startId || modalOpen()) return;
  const due = S.pending.find(p => S.day >= p.day);
  let ev = null;
  if (due) {
    ev = EVENTS.find(e => e.id === due.id);
    S.pending = S.pending.filter(p => p !== due);
  } else {
    if (S.day < S.nextEventDay) return;
    S.nextEventDay = S.day + irnd(55, 100);
    const pool = EVENTS.filter(eligible);
    if (!pool.length) return;
    ev = pick(pool);
  }
  if (!ev) return;
  if (!S.seen.includes(ev.id)) S.seen.push(ev.id);
  S.lastFired = S.lastFired || {};
  S.lastFired[ev.id] = S.day;
  S.speed = 0;
  openEvent(ev);
}
const evText = (v) => typeof v === 'function' ? v() : v;

function openEvent(ev) {
  ui.screen = 'event';
  sfx('start');
  const choices = ev.choices.map((c, i) => {
    const cost = c.cost ? (typeof c.cost === 'function' ? c.cost() : c.cost) : 0;
    const can = cost <= S.cash;
    return '<button class="ev-choice" data-ch="' + i + '"' + (can ? '' : ' disabled') + '>' +
      '<span class="ev-ch-main"><b>' + esc(c.label) + '</b>' +
        (c.hint ? '<span class="ev-hint">' + esc(c.hint) + '</span>' : '') + '</span>' +
      (cost ? '<span class="ev-cost' + (can ? '' : ' no') + '">' + moneyFull(cost) + '</span>' : '') +
      '</button>';
  }).join('');
  sheet({
    icon: ev.icon, title: evText(ev.title), size: 'md',
    sub: '<span class="ev-tag">' + esc(ev.tag || 'Situation') + '</span> · ' + dotDate(),
    body: '<div class="ev-body">' + evText(ev.body) + '</div>' +
      '<div class="ev-choices">' + choices + '</div>',
  });
  /* an event is a decision: no dismissing it with the X or the backdrop */
  const x = root.querySelector('[data-x]');
  if (x) x.remove();
  const back = root.querySelector('[data-back]');
  if (back) back.removeAttribute('data-back');
  root.querySelector('.ev-choices').onclick = e => {
    const b = e.target.closest('[data-ch]');
    if (!b || b.disabled) return;
    const c = ev.choices[+b.dataset.ch];
    const cost = c.cost ? (typeof c.cost === 'function' ? c.cost() : c.cost) : 0;
    if (cost > S.cash) return;
    if (cost) spend(cost);
    sfx('click');
    let outcome = '';
    try { outcome = c.run() || ''; } catch (err) { outcome = 'It did not go to plan.'; }
    logStory(evText(ev.title), c.label);
    buildOfficeLayout();
    queueSave();
    showOutcome(ev, c, outcome, cost);
  };
}
function showOutcome(ev, choice, outcome, cost) {
  sheet({
    icon: ev.icon, title: 'You chose: ' + choice.label, size: 'sm',
    sub: evText(ev.title),
    body: '<div class="ev-body">' + outcome + '</div>' +
      (cost ? '<div class="kv" style="margin-top:12px"><span>Paid</span><b>' + moneyFull(cost) + '</b></div>' : '') +
      '<div class="kv"><span>Cash now</span><b>' + moneyFull(S.cash) + '</b></div>',
    foot: '<button class="btn primary wide" data-ok>Carry on</button>',
  });
  const x = root.querySelector('[data-x]');
  if (x) x.remove();
  root.querySelector('[data-ok]').onclick = () => { closeModal(); S.speed = 1; renderHUD(); };
}

/* ==========================================================================
   18. ROUTER, INPUT, BOOT
   ========================================================================== */
function openScreen(name) {
  ({
    build: openBuild, employees: openEmployees, invest: openInvest, marketing: openMarketing,
    products: openProducts, market: openMarket, project: openProjectStatus, launch: openLaunch,
    intro: openIntro, settings: openSettings, gameover: openGameOver, category: openBuild, story: openInvest,
  }[name] || openBuild)();
}
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-screen]');
  if (!b || !S.startId) return;
  sfx('click'); openScreen(b.dataset.screen);
});
$('#hudCenter').onclick = () => { if (!S.startId) return; sfx('click'); S.project ? openProjectStatus() : openBuild(); };
$('#coPill').onclick = () => { if (S.startId) { sfx('click'); openSettings(); } };
$('#datePill').onclick = () => { if (S.startId) { sfx('click'); openSettings(); } };
$('#cashPill').onclick = () => { if (S.startId) { sfx('click'); openInvest(); } };
$('#fansPill').onclick = () => { if (S.startId) { sfx('click'); openMarketing(); } };
$('#zoomIn').onclick = () => cam.zoom = clamp(cam.zoom * 1.15, .4, 2.4);
$('#zoomOut').onclick = () => cam.zoom = clamp(cam.zoom * .87, .4, 2.4);
$('#zoomReset').onclick = () => { cam = { x: 0, y: 0, zoom: fitZoom() }; };
$('#speedBtn').onclick = () => {
  S.speed = S.speed === 0 ? 1 : S.speed === 1 ? 2 : S.speed === 2 ? 4 : 0;
  sfx('click'); renderHUD(); queueSave();
};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !S || !S.startId) return;
  if (e.key === 'Escape') { if (root.classList.contains('on')) closeModal(); return; }
  if (e.code === 'Space') { e.preventDefault(); S.speed = S.speed > 0 ? 0 : 1; renderHUD(); return; }
  const sp = { '1': 1, '2': 2, '3': 4 };
  if (sp[e.key]) { S.speed = sp[e.key]; renderHUD(); return; }
  const sc = { n: 'build', e: 'employees', d: 'invest', m: 'marketing', p: 'products', r: 'market' };
  if (sc[e.key]) { sfx('click'); openScreen(sc[e.key]); }
});
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

let lastRev = 0;
setInterval(() => {
  if (!S || !S.startId || S.speed === 0 || modalOpen()) return;
  const recent = S.revenueLog.slice(-3).reduce((a, b) => a + b, 0);
  if (recent > 0 && Date.now() - lastRev > 1500) {
    lastRev = Date.now();
    spawnParticle('+' + money(recent / 3), '#3f7a5c');
  }
}, 900);

function boot() {
  const loaded = load();
  S = loaded || freshState();
  resizeCanvas();
  if (S.startId) {
    buildOfficeLayout();
    cam = { x: 0, y: 0, zoom: fitZoom() };
    renderHUD();
    toast('info', 'Welcome back', S.company + ' · ' + dotDate());
    S.speed = S.speed || 1;
  } else {
    S.speed = 0;
    openIntro();
  }
  requestAnimationFrame(frame);
}
boot();
</script>
